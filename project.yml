# XcodeGen proje tanımı. Xcode projesini üretmek için (macOS):
#   brew install xcodegen && xcodegen generate && open Masalcik.xcodeproj
# VARSAYIM: .xcodeproj dosyasını elle sürdürmek yerine XcodeGen kullanıyoruz;
# böylece proje dosyası birleşme çakışması üretmez ve modül klasörleri otomatik eklenir.
name: Masalcik
options:
  bundleIdPrefix: com.masalcik
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  # Yalnızca test hedefinde (görsel regresyon). Uygulamaya üçüncü taraf kod girmez.
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
targets:
  Masalcik:
    type: application
    platform: iOS
    sources:
      - path: Masalcik
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masalcik.app
        # 1.0 yalnızca iPhone (iPad için 13" ekran görüntüleri gerekir; düzen hazır, 1.1 ile açılır).
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Masalcık
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Ses klonlama için kendi sesinizi kaydetmeniz gerekir. Kayıt yalnızca sizin onayınızla alınır ve istediğiniz an silinebilir."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Masalcik/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations: [tr, en]
        UIBackgroundModes: [audio]
        MasalcikSupabaseURL: $(MASALCIK_SUPABASE_URL)
        MasalcikSupabaseAnonKey: $(MASALCIK_SUPABASE_ANON_KEY)
        UIAppFonts:
          - Baloo2-ExtraBold.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
        ITSAppUsesNonExemptEncryption: false
  MasalcikTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MasalcikTests]
    dependencies:
      - target: Masalcik
      - package: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.masalcik.app.tests
  MasalcikUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MasalcikUITests]
    dependencies:
      - target: Masalcik
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.masalcik.app.uitests
        TEST_TARGET_NAME: Masalcik
schemes:
  Masalcik:
    build:
      targets:
        Masalcik: all
        MasalcikTests: [test]
        MasalcikUITests: [test]
    run:
      language: tr
      region: TR
      # Yerel StoreKit testi (Xcode): App Store Connect olmadan satın alma/deneme/yenileme denenebilir.
      storeKitConfiguration: StoreKit/Masalcik.storekit
    test:
      targets: [MasalcikTests, MasalcikUITests]
      language: tr
      region: TR
  # İngilizce arayüzü hızlı denemek için: aynı uygulama, çalıştırma ve test dili İngilizce.
  Masalcik (English):
    build:
      targets:
        Masalcik: all
        MasalcikTests: [test]
    run:
      language: en
      region: GB
      storeKitConfiguration: StoreKit/Masalcik.storekit
    test:
      targets: [MasalcikTests]
      language: en
      region: GB
