# Supabase yerel geliştirme yapılandırması (supabase start / supabase functions serve).
project_id = "masalcik"

[api]
port = 54321

[auth]
# İlk açılışta cihaza bağlı anonim kullanıcı (§5.2). Apple ile Giriş isteğe bağlı.
enable_anonymous_sign_ins = true

[auth.external.apple]
enabled = false

[functions.stories]
verify_jwt = true
[functions.library]
verify_jwt = true
[functions.voice-clone]
verify_jwt = true
[functions.entitlements]
verify_jwt = true
[functions.account]
verify_jwt = true
[functions.admin-costs]
# Kendi ADMIN_TOKEN denetimini yapar; kullanıcı oturumu gerektirmez.
verify_jwt = false
[functions.share]
# GET /share/:token herkese açık önizleme; POST kendi oturum denetimini yapar.
verify_jwt = false
[functions.appstore-notifications]
# App Store Server Notifications V2: Apple çağırır, oturum yok. Güven JWS imzası + Apple sertifika zincirinde.
verify_jwt = false
[functions.referral]
verify_jwt = true
[functions.events]
verify_jwt = true
