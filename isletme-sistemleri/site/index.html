<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Ajans OS">
</head>
<body>
<title>Ajans OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Düzen: solda koyu orman yeşili kontrol çubuğu (ilerleme halkası + menü), sağda tek sütun çalışma alanı.
   Telefonda kenar çubuğu üst şerit + alt sekme çubuğuna dönüşür. Vurgu rengi yayındaki "CANLI" kırmızısı;
   bağlı araçlar hikâye halkasıyla çevrelenir. */
:root {
  --bg: #EEF2F0; --panel: #FFFFFF; --ink: #0F2A22; --muted: #557069; --line: #D6E1DC;
  --accent: #F2434F; --accent-2: #FFA62B; --accent-ink: #FFFFFF; --accent-soft: #FFE5E6;
  --ok: #10805B; --ok-soft: #DCF2E8; --warn: #9C5A00; --warn-soft: #FFF0D4;
  --side: #0F2A22; --side-ink: #E4F0EB; --side-muted: #8DAEA3; --side-line: #22443A;
  --display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --body: "Onest", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A1512; --panel: #11201B; --ink: #E4F0EB; --muted: #8DAEA3; --line: #1F3730;
  --accent: #FF5F69; --accent-2: #FFB547; --accent-ink: #1B0608; --accent-soft: #3B171A;
  --ok: #4ED3A1; --ok-soft: #12362A; --warn: #F2B65A; --warn-soft: #34270F;
  --side: #06100D; --side-ink: #E4F0EB; --side-muted: #8DAEA3; --side-line: #1A2F29;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0A1512; --panel: #11201B; --ink: #E4F0EB; --muted: #8DAEA3; --line: #1F3730;
  --accent: #FF5F69; --accent-2: #FFB547; --accent-ink: #1B0608; --accent-soft: #3B171A;
  --ok: #4ED3A1; --ok-soft: #12362A; --warn: #F2B65A; --warn-soft: #34270F;
  --side: #06100D; --side-ink: #E4F0EB; --side-muted: #8DAEA3; --side-line: #1A2F29;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }

/* Kenar çubuğu */
aside.side { background: var(--side); color: var(--side-ink); position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 28px; padding-block: 24px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 20px; }
.logo { font: 700 18px/1 var(--display); display: flex; align-items: center; gap: 10px; letter-spacing: -0.02em; }
.live { display: inline-flex; align-items: center; gap: 6px; font: 500 10px/1 var(--mono); letter-spacing: 0.1em; background: var(--accent); color: var(--accent-ink); padding: 4px 7px 4px 6px; border-radius: 4px; }
.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.ring-box { display: flex; align-items: center; gap: 14px; }
.ring-box b { font: 700 22px/1 var(--display); display: block; }
.ring-box span { color: var(--side-muted); font-size: 13px; }
nav.menu { display: grid; gap: 4px; }
nav.menu a { display: flex; align-items: center; gap: 12px; color: var(--side-muted); text-decoration: none; padding: 11px 12px; border-radius: 10px; font-weight: 500; }
nav.menu a svg { width: 20px; height: 20px; flex: none; }
nav.menu a:hover { color: var(--side-ink); background: var(--side-line); }
nav.menu a[aria-current="page"] { color: var(--side-ink); background: var(--side-line); box-shadow: inset 3px 0 0 var(--accent); }
.side-foot { margin-top: auto; font-size: 13px; color: var(--side-muted); display: grid; gap: 8px; }
.side-foot button { background: none; border: 0; color: var(--side-muted); padding: 0; font: inherit; text-decoration: underline; cursor: pointer; justify-self: start; }

/* Ana alan */
main { min-width: 0; padding-block: 36px 80px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.page { max-width: 980px; margin: 0 auto; display: grid; gap: 32px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font: 700 32px/1.15 var(--display); letter-spacing: -0.03em; }
h2 { font: 700 19px/1.25 var(--display); letter-spacing: -0.02em; }
h3 { font: 600 17px/1.3 var(--body); }
p { margin: 0; }
.muted { color: var(--muted); }
main a:not(.btn) { color: var(--accent); font-weight: 600; text-decoration: none; }
main a:not(.btn):hover { text-decoration: underline; }
.small { font-size: 14px; }
.lead { color: var(--muted); max-width: 62ch; font-size: 17px; }
.tag { font: 500 11px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stack { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }

/* Hero */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; padding: 28px; }
.hero .big-ring b { font: 700 30px/1 var(--display); }
.hero-text { display: grid; gap: 12px; justify-items: start; }
.next { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

/* Halkalar */
.ring { position: relative; display: grid; place-items: center; flex: none; }
.ring svg { transform: rotate(-90deg); display: block; }
.ring .track { stroke: var(--side-line); }
.panel .ring .track { stroke: var(--line); }
.ring .fill { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.ring > div { position: absolute; text-align: center; line-height: 1.1; }
.ring small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.avatar { width: 48px; height: 48px; border-radius: 50%; padding: 3px; flex: none; background: var(--line); }
.avatar.on { background: conic-gradient(from 200deg, var(--accent), var(--accent-2), var(--accent)); }
.avatar.off { background: none; border: 2px dashed var(--line); padding: 1px; }
.avatar span { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 2px solid var(--panel); font: 700 15px var(--display); color: var(--ink); }

/* Düğmeler */
button, .btn { font: 600 15px/1 var(--body); border-radius: 999px; padding: 12px 18px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; white-space: nowrap; }
button:hover, .btn:hover { border-color: var(--muted); }
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.primary:hover { border-color: var(--accent); filter: brightness(1.06); }
.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 10px; }
.ghost:hover { color: var(--ink); border-color: transparent; }
:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 2px; }

/* Kurulum yolu */
ol.path { list-style: none; margin: 0; padding: 0; display: grid; }
ol.path li { display: grid; grid-template-columns: 28px auto minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
ol.path li:last-child { border-bottom: 0; }
ol.path li.done { background: color-mix(in srgb, var(--ok-soft) 45%, transparent); }
ol.path li.next { box-shadow: inset 4px 0 0 var(--accent); }
.step { font: 500 13px var(--mono); color: var(--muted); text-align: right; }
.step-body { display: grid; gap: 6px; min-width: 0; }
.step-body p { font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 13px/1 var(--body); padding: 6px 10px; border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* Sistemler */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { flex: 1 1 260px; position: relative; }
.search input { padding-left: 42px; }
.search svg { position: absolute; left: 14px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--muted); }
input, select, textarea { font: 16px var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; width: 100%; min-width: 0; min-height: 44px; }
textarea { resize: vertical; min-height: 80px; }
select.cat { width: auto; flex: none; }
input[type="range"] { padding: 0; accent-color: var(--accent); min-height: 0; }
.sys-list { display: grid; }
details.sys { border-bottom: 1px solid var(--line); }
details.sys:last-child { border-bottom: 0; }
details.sys summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 20px; gap: 14px; align-items: center; padding: 16px 20px; }
details.sys summary::-webkit-details-marker { display: none; }
details.sys summary:hover { background: color-mix(in srgb, var(--bg) 60%, transparent); }
details.sys summary .chev { transition: rotate .2s; color: var(--muted); }
details.sys[open] summary .chev { rotate: 90deg; }
.num { font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.sys-name b { font-weight: 600; display: block; }
.sys-name span { color: var(--muted); font-size: 14px; }
.sys-body { padding: 0 20px 22px 68px; display: grid; gap: 18px; }
.lock { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.lock .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.lock button { min-height: 36px; padding: 8px 14px; font-size: 14px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px 28px; }
.cols h4 { margin: 0 0 8px; font: 500 11px/1.2 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.cols ul, .cols ol { margin: 0; padding-left: 20px; display: grid; gap: 5px; font-size: 15px; }
.empty { padding: 28px 20px; text-align: center; color: var(--muted); }

/* Ekip */
.scenarios { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.scenario { text-align: left; display: grid; gap: 4px; padding: 14px 16px; border-radius: 14px; white-space: normal; justify-content: stretch; min-height: 0; }
.scenario b { font-weight: 600; }
.scenario span { color: var(--muted); font-weight: 400; font-size: 14px; line-height: 1.35; }
.scenario[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.convo { padding: 24px; display: grid; gap: 18px; }
.bubble { justify-self: start; max-width: 520px; background: var(--bg); border-radius: 18px 18px 18px 4px; padding: 12px 16px; display: grid; gap: 4px; }
.bubble .tag { font-size: 10px; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 14px; position: relative; padding-bottom: 16px; }
.timeline li:last-child { padding-bottom: 0; }
.timeline li::before { content: ""; position: absolute; left: 10px; top: 22px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline i { width: 22px; height: 22px; border-radius: 50%; background: var(--panel); border: 2px solid var(--muted); display: block; margin-top: 1px; }
.timeline li.stop i { border-color: var(--warn); background: var(--warn); }
.timeline li.go i { border-color: var(--ok); background: var(--ok); }
.timeline b { font-weight: 600; }
.verdict { border-radius: 14px; padding: 16px 18px; display: grid; gap: 4px; }
.verdict b { font: 700 17px/1.3 var(--display); letter-spacing: -0.01em; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.wait { background: var(--accent-soft); color: var(--ink); }
.verdict.stop { background: var(--warn-soft); color: var(--warn); }
details.custom > summary { cursor: pointer; font-weight: 600; color: var(--accent); list-style: none; display: inline-flex; gap: 6px; align-items: center; min-height: 44px; }
details.custom > summary::-webkit-details-marker { display: none; }
form.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-top: 6px; }
form.fields .full { grid-column: 1 / -1; }
label.f { display: grid; gap: 6px; font-size: 14px; color: var(--muted); font-weight: 500; }
label.chk { display: flex; gap: 10px; align-items: center; font-size: 15px; }
label.chk input { width: 20px; height: 20px; min-height: 0; accent-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.dep { padding: 16px; display: grid; gap: 8px; align-content: start; }
.stops { padding-block: 4px; }
.stop-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.stop-row:last-child { border-bottom: 0; }
.stop-row b { font-weight: 600; }

/* Markalar */
.brands { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.brand { padding: 18px; display: grid; gap: 10px; align-content: start; }
.brand .row { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.brand-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.brand-actions { display: flex; gap: 4px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.brand-actions button { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.person { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.person b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pav { width: 26px; height: 26px; border-radius: 50%; flex: none; background: var(--line); display: grid; place-items: center; font: 700 12px var(--display); object-fit: cover; }
.group-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.chip.risk { background: var(--accent-soft); color: var(--accent); }
.mform { padding: 22px; }
.picker { display: grid; gap: 8px; }
.picker .chip { cursor: pointer; border: 1px solid var(--line); min-height: 36px; padding: 8px 12px; }

/* Araçlar */
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; }
.tool { padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.tool .row { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.tool .int-head { display: flex; gap: 12px; align-items: start; min-width: 0; }
.tool .avatar { width: 40px; height: 40px; }
.price { font: 700 16px var(--display); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.need { background: transparent; border: 1px solid var(--line); }
.options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.option { display: grid; gap: 4px; justify-items: start; text-align: left; white-space: normal; border-radius: 12px; padding: 10px 12px; min-height: 0; font-weight: 400; }
.option b { font-weight: 600; font-size: 14px; line-height: 1.3; }
.option .tag { font-size: 10px; }
.option[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-soft); }

/* Maliyet */
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; padding: 22px; align-items: end; }
.seg { display: inline-flex; background: var(--bg); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; min-height: 38px; padding: 8px 14px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--panel); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }
.plan { padding: 16px 20px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.plan > div:first-child { flex: 1 1 280px; display: grid; gap: 4px; }
.seg { flex-wrap: wrap; }
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.figure { padding: 20px; display: grid; gap: 6px; }
.figure b { font: 700 32px/1 var(--display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.figure.hl { background: var(--side); color: var(--side-ink); border-color: var(--side); }
.figure.hl .muted, .figure.hl .tag { color: var(--side-muted); }
.bars { padding: 10px 22px 22px; display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr) 80px; gap: 14px; align-items: center; font-size: 15px; }
.bar-row .track { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
.bar-row .track span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 5px; }
.bar-row .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* Bildirim */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; background: var(--side); color: var(--side-ink); padding: 12px 18px; border-radius: 999px; font-weight: 500; box-shadow: 0 8px 24px rgb(0 0 0 / 0.25); z-index: 20; max-width: calc(100vw - 32px); display: flex; gap: 10px; align-items: center; }
.toast::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  aside.side { position: sticky; z-index: 10; height: auto; flex-direction: row; align-items: center; justify-content: space-between; padding-block: 12px; gap: 12px; padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--side); }
  .logo { white-space: nowrap; font-size: 16px; }
  .ring-box { gap: 10px; }
  .ring-box .ring, .ring-box svg { width: 36px !important; height: 36px !important; }
  .ring-box b { font-size: 15px; white-space: nowrap; }
  .ring-box span { display: none; }
  .side-foot { display: none; }
  nav.menu { position: fixed; inset: auto 0 0 0; z-index: 10; grid-template-columns: repeat(5, 1fr); gap: 0; background: var(--side); border-top: 1px solid var(--side-line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  nav.menu a { flex-direction: column; gap: 4px; font-size: 11px; padding: 10px 4px; border-radius: 0; text-align: center; }
  nav.menu a[aria-current="page"] { box-shadow: inset 0 3px 0 var(--accent); }
  main { padding-block: 24px calc(100px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}
@media (max-width: 600px) {
  h1 { font-size: 25px; }
  .hero { grid-template-columns: 1fr; padding: 22px; gap: 18px; }
  ol.path li { grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 16px; }
  ol.path li .step { display: none; }
  ol.path li > :last-child { grid-column: 1 / -1; justify-self: start; }
  details.sys summary { grid-template-columns: 28px minmax(0, 1fr) 16px; padding: 14px 16px; }
  details.sys summary .chip { grid-column: 2; grid-row: 2; justify-self: start; }
  details.sys summary .chev { grid-column: 3; grid-row: 1; }
  .sys-body { padding: 0 16px 20px; }
  form.fields { grid-template-columns: 1fr; }
  .options { grid-template-columns: 1fr; }
  .scenarios { grid-auto-flow: column; grid-auto-columns: 72%; grid-template-columns: none; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; }
  .scenario { scroll-snap-align: start; }
  .convo { padding: 18px; }
  .bar-row { grid-template-columns: minmax(0, 1fr) 70px; }
  .bar-row .track { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="side">
    <div class="logo">Ajans OS <span class="live">CANLI</span></div>
    <div class="ring-box" id="ozet"></div>
