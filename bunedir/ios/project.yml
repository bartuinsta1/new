# XcodeGen: brew install xcodegen && xcodegen generate && open BuNedir.xcodeproj
name: BuNedir
options:
  bundleIdPrefix: app.bunedir
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  BuNedir:
    type: application
    platform: iOS
    sources:
      - path: BuNedir
      - path: Shared
      # İçerik kopyalanmaz: depodaki ../content klasörü paket içine "content" olarak girer.
      - path: ../content
        type: folder
        buildPhase: resources
    dependencies:
      - target: BuNedirWidget
      - target: BuNedirKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bunedir.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Bu Nedir?"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: BuNedir/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: tr
        CFBundleURLTypes:
          - CFBundleURLName: app.bunedir
            CFBundleURLSchemes: [bunedir]
        BuNedirSupabaseURL: $(BUNEDIR_SUPABASE_URL)
        BuNedirSupabaseAnonKey: $(BUNEDIR_SUPABASE_ANON_KEY)
        ITSAppUsesNonExemptEncryption: false
  BuNedirWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BuNedirWidget
      - path: Shared
      - path: ../content
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bunedir.ios.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Bu Nedir?"
    info:
      path: BuNedirWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  BuNedirKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: BuNedirKeyboard
      - path: Shared
      - path: ../content
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bunedir.ios.keyboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Bu Nedir?"
    info:
      path: BuNedirKeyboard/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: tr-TR
            # Tam Erişim yok: yazılanlar cihazdan çıkmaz, ağ erişimi yok.
            RequestsOpenAccess: false
  BuNedirTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BuNedirTests]
    dependencies:
      - target: BuNedir
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BuNedir.app/BuNedir
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  BuNedir:
    build:
      targets:
        BuNedir: all
    test:
      targets: [BuNedirTests]
