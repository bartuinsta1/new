# Bu Nedir? (widget uygulaması): içerik + backend testleri, Android derleme + testler, iOS derleme + testler.
# Yalnızca bunedir/ değişince çalışır.
name: Bu Nedir CI

on:
  push:
    paths: ["bunedir/**", ".github/workflows/bunedir.yml"]
  pull_request:
    paths: ["bunedir/**", ".github/workflows/bunedir.yml"]
  workflow_dispatch:

concurrency:
  group: bunedir-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bunedir

jobs:
  content-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: İçerik doğrulama + test vektörleri güncel mi
        run: node scripts/check-content.mjs --check
      - name: Günün kelimesi kuralı
        run: node --test tests/daily.test.mjs
      - name: Backend (deneme kodu)
        run: cd backend && npm test

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Birim testleri + debug APK
        working-directory: bunedir/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bunedir-debug-apk
          path: bunedir/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: XcodeGen
        working-directory: bunedir/ios
        run: brew install xcodegen && xcodegen generate
      - name: Derleme + birim testleri
        working-directory: bunedir/ios
        run: ./ci-test.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bunedir-ios-log
          path: bunedir/ios/build/*.log
          retention-days: 7
