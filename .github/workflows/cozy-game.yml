name: Mırnav Hanı

on:
  push:
    paths:
      - 'cozy-game/**'
      - '.github/workflows/cozy-game.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: cozy-game

jobs:
  web:
    name: Test + web demo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cozy-game/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:demo
      - name: Web demosunu gh-pages dalına yayınla
        if: github.ref_name == github.event.repository.default_branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Web demo ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cozy-game/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build && npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: cozy-game/android
      - uses: actions/upload-artifact@v4
        with:
          name: mirnav-hani-debug-apk
          path: cozy-game/android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS derleme kontrolü
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cozy-game/package-lock.json
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build | tail -n 40
        shell: bash -o pipefail {0}
