# Sürekli tümleştirme: her push'ta sunucu testleri (Postgres dahil) ve iOS derleme + birim + UI testleri.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck + birim testleri + çeviri denetimi
        run: npm run check
      - name: Postgres depoları (gerçek veritabanı)
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./scripts/test-pg.sh
      - name: App Store metin sınırları
        run: python3 ../scripts/check_appstore.py

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate
      - name: Derleme + birim testleri
        run: ./scripts/ci/ios-test.sh unit
      - name: UI testleri
        run: ./scripts/ci/ios-test.sh ui
      - name: Sonuç paketi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/*.xcresult
          retention-days: 7
