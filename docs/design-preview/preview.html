<!doctype html>
<!--
  Masalcık tasarım sistemi — web önizlemesi.
  SwiftUI Preview'larının (DesignSystem/Gallery/ComponentGalleryView.swift) birebir geometriyle web kopyası.
  Amaç: Xcode olmayan ortamda (CI, bulut) ekran görüntüsü üretmek. Doğruluk kaynağı Swift kodudur.
  Ekran görüntüsü: node docs/design-preview/screenshot.mjs
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masalcık Tasarım Sistemi</title>
<style>
  @font-face { font-family: "Baloo 2"; font-weight: 800; src: url("../../Masalcik/Resources/Fonts/Baloo2-ExtraBold.ttf"); }
  @font-face { font-family: "Nunito"; font-weight: 600; src: url("../../Masalcik/Resources/Fonts/Nunito-SemiBold.ttf"); }
  @font-face { font-family: "Nunito"; font-weight: 700; src: url("../../Masalcik/Resources/Fonts/Nunito-Bold.ttf"); }
  :root {
    --sky:#5BC8F5; --grass:#7ED957; --sun:#FFC93C; --berry:#FF6B8B; --grape:#8B6CEF; --orange:#FF9F43;
    --ink:#2B2D42; --cream:#FFF8EC; --nightSky:#1E1B4B; --dusk:#3B2F6B; --moon:#FFE8A3; --firefly:#FFD166; --nightInk:#E8E6FF;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #d9d4e8; font-family: "Nunito", sans-serif; font-weight: 600; padding: 24px; }
  .row { display: flex; gap: 28px; align-items: flex-start; justify-content: center; }
  .phone { width: 390px; height: 844px; border-radius: 48px; overflow: hidden; position: relative;
           border: 10px solid #111; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .phone .scroll { position: absolute; inset: 0; overflow: hidden; padding: 54px 16px 16px; }
  .phone canvas.sky { position: absolute; inset: 0; width: 100%; height: 100%; }
  .day { background: var(--cream); color: var(--ink); }
  .night { color: var(--nightInk); }
  .h-display { font-family: "Baloo 2"; font-weight: 800; font-size: 40px; line-height: 1.05; }
  .h-title { font-family: "Baloo 2"; font-weight: 800; font-size: 28px; line-height: 1.1; }
  .h-headline { font-family: "Baloo 2"; font-weight: 800; font-size: 22px; line-height: 1.15; }
  .body { font-size: 17px; }
  .bodyBold { font-size: 17px; font-weight: 700; }
  .caption { font-size: 14px; font-weight: 700; }
  section { margin-top: 18px; }
  section > .h-headline { margin-bottom: 8px; }
  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .sw { text-align: center; }
  .sw .chip { height: 52px; border-radius: 14px; border: 3px solid var(--outline); overflow: hidden; display: flex; flex-direction: column; }
  .sw .chip div:first-child { flex: 1; } .sw .chip div:last-child { height: 10px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 3px solid var(--outline); color: var(--ink);
         border-radius: 24px; font-family: "Baloo 2"; font-weight: 800; position: relative; }
  .btn.large { min-height: 96px; padding: 0 24px; font-size: 26px; }
  .btn.circle { border-radius: 50%; width: 64px; height: 64px; justify-content: center; font-size: 26px; }
  .chars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; text-align: center; }
  .cards { display: flex; gap: 14px; overflow: hidden; }
  .card { width: 150px; flex: none; border-radius: 28px; border: 3px solid var(--outline); overflow: hidden; position: relative; }
  .card .cover { height: 117px; position: relative; overflow: hidden; }
  .card .t { min-height: 48px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 8px; font-weight: 700; font-size: 15px; line-height: 1.15; }
  .badge { position: absolute; top: 8px; right: 8px; padding: 3px 9px; border-radius: 99px; border: 2px solid var(--outline); color: var(--ink); font-size: 13px; font-weight: 700; z-index: 3; }
  .heart { position: absolute; top: 6px; left: 9px; font-size: 22px; color: var(--berry); z-index: 3; }
  .stars { display: flex; gap: 5px; }
  .stickers { display: flex; gap: 12px; margin-top: 10px; }
  .prompt { display: flex; align-items: center; gap: 8px; }
  .tr { margin-top: 2px; }
  .label { display:inline-block; padding: 2px 12px; border-radius: 99px; border: 2px solid var(--outline); color: var(--ink); font-weight: 700; font-size: 15px; }
  .caption-under { text-align: center; font: 700 15px Nunito; color: #3b3554; margin-top: 10px; }
  .gate { padding: 54px 24px 24px; text-align: center; }
  .keypad { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px 10px; justify-content: center; margin-top: 20px; }
  .key { height: 58px; border-radius: 24px; border: 3px solid var(--outline); display: flex; align-items: center; justify-content: center; font: 800 28px "Baloo 2"; color: var(--ink); }
  .digits { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
  .digit { width: 56px; height: 64px; border-radius: 16px; border: 3px solid var(--outline); background: #fff; font: 800 28px "Baloo 2"; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
<div class="row" id="root"></div>
<script>
// ---------- Renk yardımcıları (Colors.swift ile aynı) ----------
function hexToRgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)/255);}
function rgbToHsb([r,g,b]){const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;
  if(d){if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6;if(h<0)h+=1;}
  return [h,max?d/max:0,max];}
function hsbToHex([h,s,v]){const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  const [r,g,b]=[[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6];
  return '#'+[r,g,b].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('');}
const darkened=(hex,a=0.2)=>{const [h,s,b]=rgbToHsb(hexToRgb(hex));return hsbToHex([h,s,b*(1-a)]);};
const desat=(hex,a)=>{const [h,s,b]=rgbToHsb(hexToRgb(hex));return hsbToHex([h,s*(1-a),b*(1-a*0.35)]);};
const P={sky:'#5BC8F5',grass:'#7ED957',sun:'#FFC93C',berry:'#FF6B8B',grape:'#8B6CEF',orange:'#FF9F43',ink:'#2B2D42',cream:'#FFF8EC',
  nightSky:'#1E1B4B',dusk:'#3B2F6B',moon:'#FFE8A3',firefly:'#FFD166',nightInk:'#E8E6FF'};
const accent=(name,mode)=>mode==='day'?P[name]:desat(P[name],0.4);
const outline=mode=>mode==='day'?P.ink:'#14112F';

// ---------- Karakter çizimleri (CharacterArt.swift ile aynı 200×200 geometri) ----------
function lerp(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}
function roundedPoly(v,r){let d=`M${lerp(v[0],v[1],r)}`;const n=v.length;
  for(let i=0;i<n;i++){const cur=v[(i+1)%n],prev=v[i],next=v[(i+2)%n];
    d+=` L${lerp(cur,prev,r)} Q${cur} ${lerp(cur,next,r)}`;}return d+'Z';}
function starPath(cx,cy,outer){const v=[];for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rad=i%2?outer*0.52:outer;
  v.push([cx+Math.cos(a)*rad,cy+Math.sin(a)*rad]);}return roundedPoly(v,0.32);}
function kitePath(x,y,w,h){return roundedPoly([[x+w/2,y],[x+w,y+h*0.42],[x+w/2,y+h],[x,y+h*0.42]],0.2);}

function Art(mode){
  const O=outline(mode);
  const c=hex=>mode==='day'?hex:desat(hex,0.4);
  const st=`stroke="${O}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
  const E=(x,y,w,h,fill,rot=0)=>`<ellipse cx="${x}" cy="${y}" rx="${w/2}" ry="${h/2}" fill="${fill}" ${st} transform="rotate(${rot} ${x} ${y})"/>`;
  const C=(x,y,w,h,fill)=>{const d=Math.min(w,h);return `<circle cx="${x}" cy="${y}" r="${d/2}" fill="${fill}" ${st}/>`;};
  const closedEye=(x,y,w,h,lw=4)=>`<path d="M${x-w/2} ${y-h/2} Q${x} ${y-h/2+h*1.6} ${x+w/2} ${y-h/2}" fill="none" stroke="${O}" stroke-width="${lw}" stroke-linecap="round"/>`;
  function face(mood,eyeSize,spacing,dx=0,dy=0){let s='';
    for(const side of [-1,1]){const x=100+side*spacing/2+dx,y=92+dy;
      if(mood==='sleepy') s+=closedEye(x,y,eyeSize,eyeSize*0.3);
      else{const e=mood==='surprised'?eyeSize*1.15:eyeSize;
        s+=`<circle cx="${x}" cy="${y}" r="${e/2}" fill="${P.ink}"/><circle cx="${x+e*0.16}" cy="${y-e*0.16}" r="${e*0.18}" fill="#fff"/>`;}}
    for(const side of [-1,1]) s+=`<ellipse cx="${100+side*(spacing/2+18)+dx}" cy="${114+dy}" rx="10" ry="6" fill="${P.berry}" fill-opacity=".45"/>`;
    const mx=100+dx,my=120+dy;
    if(mood==='happy'){const x0=mx-13,y0=my-7;s+=`<path d="M${x0} ${y0} L${x0+26} ${y0} Q${mx} ${y0+25.2} ${x0} ${y0}Z" fill="#C2344F" ${st}/>`;}
    else if(mood==='surprised') s+=`<ellipse cx="${mx}" cy="${my}" rx="7" ry="9" fill="#C2344F" ${st}/>`;
    else s+=`<ellipse cx="${mx}" cy="${my}" rx="8" ry="5.5" fill="#C2344F" ${st}/>`;
    return s;}
  return {
    pamuk(m){let s='';for(const [x,y] of [[60,70],[100,50],[140,70],[155,115],[135,155],[100,165],[65,155],[45,115]]) s+=C(x,y,62,62,c('#FFFFFF'));
      s+=C(100,110,120,120,c('#FFFFFF'))+E(44,92,42,22,c('#F3D9C4'),-25)+E(156,92,42,22,c('#F3D9C4'),25)+E(100,108,96,86,c('#F3D9C4'))
       +C(88,62,34,34,c('#FFFFFF'))+C(112,60,36,36,c('#FFFFFF'))+face(m,22,40,0,6);return s;},
    findik(m){return E(158,92,92,120,c('#E2553B'),15)+C(166,70,40,40,c('#F08A5D'))+E(66,46,30,44,c('#E2553B'),-15)+E(130,46,30,44,c('#E2553B'),15)
      +E(98,108,132,128,c('#E2553B'))+E(98,122,90,70,c('#FFE3C2'))+face(m,26,50,-2,0)+E(98,108,12,9,P.ink);},
    lodos(m){return `<path d="M100 180 C110 200 130 180 150 196" fill="none" stroke="${P.ink}" stroke-width="3" stroke-linecap="round"/>`
      +C(124,190,14,14,c('#FFC93C'))+C(150,196,14,14,c('#5BC8F5'))
      +`<path d="${kitePath(25,11,150,170)}" fill="${c('#FF9F43')}" ${st}/>`
      +`<path d="M100 22 L100 172 M34 82 L166 82" stroke="${P.ink}" stroke-opacity=".25" stroke-width="3" stroke-linecap="round"/>`+face(m,22,48,0,4);},
    nur(m){return E(58,42,28,46,c('#8C6A52'),-25)+E(142,42,28,46,c('#8C6A52'),25)+E(100,108,150,160,c('#A47E62'))+E(100,138,92,84,c('#F3DFC4'))
      +E(32,126,34,76,c('#8C6A52'),12)+E(168,126,34,76,c('#8C6A52'),-12)+face(m,22,52,0,-8)
      +`<circle cx="74" cy="84" r="21" fill="none" stroke="${P.ink}" stroke-width="4"/><circle cx="126" cy="84" r="21" fill="none" stroke="${P.ink}" stroke-width="4"/>`
      +`<rect x="94" y="80" width="12" height="4" rx="2" fill="${P.ink}"/>`+E(100,106,16,14,c('#FFC93C'));},
    yildiz(m){return `<circle cx="100" cy="100" r="95" fill="${P.moon}" fill-opacity=".45" filter="url(#blur)"/>`
      +`<path d="${starPath(100,104,92)}" fill="${c('#FFD23F')}" ${st}/>`+face(m,22,40,0,12);},
    kaptan_midye(m){let s=C(24,108,42,42,c('#F25C54'))+C(176,108,42,42,c('#F25C54'))
      +`<rect x="70" y="42" width="12" height="40" rx="6" fill="${c('#F25C54')}" ${st}/><rect x="118" y="42" width="12" height="40" rx="6" fill="${c('#F25C54')}" ${st}/>`
      +E(100,124,152,110,c('#F25C54'));
      for(const x of [56,78,122,144]) s+=`<rect x="${x-6}" y="168" width="12" height="24" rx="6" fill="${c('#D94740')}" ${st}/>`;
      s+=`<rect x="65" y="21" width="70" height="30" rx="10" fill="${c('#2B4C7E')}" ${st}/><rect x="57" y="44" width="86" height="12" rx="6" fill="#fff" ${st}/>`+C(100,34,12,12,c('#FFC93C'));
      if(m==='sleepy') s+=closedEye(76,44,18,6)+closedEye(124,44,18,6);
      else{const r=m==='surprised'?8:6;s+=C(76,44,26,26,'#fff')+C(124,44,26,26,'#fff')+`<circle cx="78" cy="45" r="${r}" fill="${P.ink}"/><circle cx="126" cy="45" r="${r}" fill="${P.ink}"/>`;}
      // Bıyık (MustacheShape, 96×30 çerçeve, merkez 100,118)
      const x=52,y=103,w=96,h=30,mx=x+w/2;
      s+=`<path d="M${mx} ${y+h*.2} C${x+w*.3} ${y+h} ${x+w*.05} ${y+h} ${x} ${y+h*.25} C${x+w*.1} ${y+h*.6} ${x+w*.35} ${y} ${mx} ${y+h*.2} C${x+w-w*.35} ${y} ${x+w-w*.1} ${y+h*.6} ${x+w} ${y+h*.25} C${x+w-w*.05} ${y+h} ${x+w-w*.3} ${y+h} ${mx} ${y+h*.2}Z" fill="${c('#F7F2E8')}" ${st}/>`;
      if(m==='happy') s+=`<path d="M90 135 L110 135 Q100 153 90 135Z" fill="#7A1F2B"/>`;
      else s+=`<ellipse cx="100" cy="142" rx="${m==='surprised'?6:7}" ry="${m==='surprised'?7:4.5}" fill="#7A1F2B"/>`;
      return s;}
  };
}
function charSVG(id,mood,size,mode){
  return `<svg width="${size}" height="${size}" viewBox="0 0 200 200" overflow="visible"><defs><filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter></defs>${Art(mode)[id](mood)}</svg>`;}

const CHARS=[['pamuk','Pamuk'],['findik','Fındık'],['lodos','Lodos'],['nur','Bilge Baykuş Nur'],['yildiz','Yıldız'],['kaptan_midye','Kaptan Midye']];
const REGION={whisper_forest:'grass',storyteller_plane:'orange',star_hill:'grape',lighthouse_cove:'sky'};

// ---------- Bileşenler ----------
function bubble(label,icon,color,mode,{large=false,circle=false}={}){
  const f=accent(color,mode),sh=darkened(f,0.2);
  const cls=circle?'btn circle':'btn'+(large?' large':'');
  return `<span class="${cls}" style="background:${f};box-shadow:0 6px 0 ${sh},0 6px 0 3px ${outline(mode)}">${icon}${label?`<span>${label}</span>`:''}</span>`;}
function cloud(size,mode){const w=size,h=size*0.68,O=outline(mode),fill=mode==='day'?'#fff':'#C9C3E8';
  const X=f=>w*f,Y=f=>h*f;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" overflow="visible">
   <path d="M${X(.18)} ${h} C${X(-.04)} ${h} ${X(-.02)} ${Y(.5)} ${X(.12)} ${Y(.45)} C${X(.12)} ${Y(.12)} ${X(.3)} ${Y(.05)} ${X(.42)} ${Y(.12)} C${X(.55)} ${Y(-.08)} ${X(.78)} ${Y(.05)} ${X(.78)} ${Y(.3)} C${X(1.06)} ${Y(.32)} ${X(1.08)} ${h} ${X(.84)} ${h}Z" fill="${fill}" stroke="${O}" stroke-width="3" stroke-linejoin="round"/>
   <path d="M${w/2-size*.29} ${h/2+size*.025} q${size*.065} ${size*.11} ${size*.13} 0 M${w/2+size*.16} ${h/2+size*.025} q${size*.065} ${size*.11} ${size*.13} 0" fill="none" stroke="${O}" stroke-width="3" stroke-linecap="round"/>
   <circle cx="${w/2-size*.215}" cy="${h/2+size*.13}" r="${size*.045}" fill="${P.berry}" fill-opacity=".35"/><circle cx="${w/2+size*.215}" cy="${h/2+size*.13}" r="${size*.045}" fill="${P.berry}" fill-opacity=".35"/>
   <text x="${w/2+size*.42}" y="${h/2-size*.33}" font-family="Baloo 2" font-weight="800" font-size="22" fill="${mode==='day'?P.ink:P.nightInk}" fill-opacity=".7">z</text></svg>`;}
function backdrop(region,mode){const base=accent(REGION[region],mode);
  const bg=mode==='day'?`linear-gradient(${P.sky}8c, ${base}d9)`:`linear-gradient(${P.nightSky}, ${P.dusk}e6, ${base}99)`;
  const orb=mode==='night'?`<div style="position:absolute;width:22px;height:22px;border-radius:50%;background:${P.moon};left:calc(50% + 39px);top:calc(50% - 51px)"></div>`
    :`<div style="position:absolute;width:28px;height:28px;border-radius:50%;background:${P.sun};left:calc(50% - 69px);top:calc(50% - 54px)"></div>`;
  return `<div style="position:absolute;inset:0;background:${bg}"></div><div style="position:absolute;width:320px;height:140px;border-radius:50%;background:${darkened(base,.15)};left:calc(50% - 160px);top:calc(50% + 0px)"></div>${orb}`;}
function storyCard(title,region,mins,char,mode,{fav=false,sleeping=false,lang='tr'}={}){
  const surface=mode==='day'?'#fff':P.dusk,ink=mode==='day'?P.ink:P.nightInk;
  return `<div class="card" style="box-shadow:0 6px 0 ${darkened(accent(REGION[region],mode),.2)}"><div class="cover">${backdrop(region,mode)}
   <div style="position:absolute;left:30px;top:22px">${charSVG(char,mode==='night'?'sleepy':'happy',90,mode)}</div>
   ${sleeping?`<div style="position:absolute;inset:0;backdrop-filter:blur(8px);background:rgba(255,255,255,.25)"></div><div style="position:absolute;left:28px;top:30px">${cloud(93,mode)}</div>`:''}
   <span class="badge" style="background:${mode==='day'?P.sun:P.moon}">☾ ${mins} ${lang==='en'?'min':'dk'}</span>${fav?'<span class="heart">♥</span>':''}</div>
   <div class="t" style="background:${surface};color:${ink}">${title}</div></div>`;}
function island(region,mode,{locked=false,size=130,guide}={}){
  const base=accent(REGION[region],mode),O=outline(mode),icons={lighthouse_cove:'⛯',star_hill:'☾',whisper_forest:'♣',storyteller_plane:'📖'};
  return `<div style="position:relative;width:${size*1.1}px;height:${size*.95}px">
    <div style="position:absolute;width:${size}px;height:${size*.62}px;border-radius:50%;background:${darkened(base,.25)};left:${size*.05}px;top:${size*.165+size*.1}px"></div>
    <div style="position:absolute;width:${size}px;height:${size*.62}px;border-radius:50%;background:${base};border:3px solid ${O};left:${size*.05}px;top:${size*.165}px"></div>
    <div style="position:absolute;width:${size*.36}px;height:${size*.36}px;border-radius:50%;background:${mode==='day'?'#fff':P.moon};border:3px solid ${O};left:${size*.37}px;top:${size*.075}px;display:flex;align-items:center;justify-content:center;font-size:${size*.2}px;color:${P.ink}">${icons[region]||ICON[region]}</div>
    ${locked?`<div style="position:absolute;left:${size*.075}px;top:${size*.1}px">${cloud(size*.95,mode)}</div>`
      :`<div style="position:absolute;left:${size*.68}px;top:${size*.265}px">${charSVG(guide,mode==='night'?'sleepy':'happy',size*.42,mode)}</div>`}</div>`;}
function star(on,mode){const O=outline(mode),f=on?(mode==='day'?P.sun:P.firefly):(mode==='day'?'#ffffff99':P.dusk+'99');
  return `<svg width="32" height="32" viewBox="0 0 32 32" style="${on?'':'transform:scale(.85)'};${on&&mode==='night'?`filter:drop-shadow(0 0 6px ${P.firefly}99)`:''}"><path d="${starPath(16,16,15)}" fill="${f}" stroke="${O}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;}
function sticker(emoji,color,earned,mode,rot){
  return `<div style="width:64px;height:64px;border-radius:50%;background:#fff;border:3px solid ${outline(mode)};display:flex;align-items:center;justify-content:center;transform:rotate(${rot}deg);opacity:${earned?1:.55};box-shadow:0 4px 0 rgba(0,0,0,.12)">
   <div style="width:52px;height:52px;border-radius:50%;background:${accent(color,mode)};display:flex;align-items:center;justify-content:center;font-size:29px;${earned?'':'filter:grayscale(1);opacity:.35'}">${emoji}</div></div>`;}

// ---------- Gece gökyüzü (NightSkyBackground.swift ile aynı deterministik dağılım) ----------
function splitmix(seed){let s=BigInt(seed);const M=(1n<<64n)-1n;return ()=>{s=(s+0x9E3779B97F4A7C15n)&M;let z=s;
  z=((z^(z>>30n))*0xBF58476D1CE4E5B9n)&M;z=((z^(z>>27n))*0x94D049BB133111EBn)&M;z=z^(z>>31n);return Number(z>>11n)/2**53;};}
function genStars(n,seed){const r=splitmix(seed);return Array.from({length:n},()=>({x:r(),y:r(),rad:.8+r()*1.8,speed:.6+r()*1.6,phase:r()*Math.PI*2}));}
function drawSky(cv,{dimming=0,t=3.2}={}){const dpr=2,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;
  const g=cv.getContext('2d');g.scale(dpr,dpr);
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,P.nightSky);gr.addColorStop(.5,P.dusk);gr.addColorStop(1,'#5A3F7A');g.fillStyle=gr;g.fillRect(0,0,W,H);

function dots(cur,mode){return `<div style="display:flex;gap:8px;align-items:center">${[1,2,3,4,5,6].map(i=>`<span style="width:${i===cur?28:14}px;height:14px;border-radius:99px;border:2px solid ${outline(mode)};background:${i<=cur?accent(mode==='day'?'sun':'grape',mode):(mode==='day'?'#fff':P.dusk)}"></span>`).join('')}</div>`;}
function obTop(cur,mode,{back=true}={}){return `<div style="display:flex;align-items:center;justify-content:space-between;padding:54px 16px 0">${back?bubble('','‹','sky',mode,{circle:true}):'<span style="width:64px"></span>'}${dots(cur,mode)}<span style="width:64px"></span></div>`;}
function obBottom(label,mode,{enabled=true,skip=null,icon='→',color='grass'}={}){return `<div style="position:absolute;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px">
  <div style="opacity:${enabled?1:.5}">${bubble(label,icon,enabled?color:'sky',mode,{large:true})}</div>${skip?`<div class="bodyBold" style="text-decoration:underline;opacity:.7">${skip}</div>`:''}</div>`;}
function choice(emoji,title,sel,color,mode,size=100){const f=accent(sel?color:'sky',mode);
  return `<div style="position:relative;width:${size}px;height:${size}px;border-radius:50%;background:${f};border:3px solid ${outline(mode)};box-shadow:0 6px 0 ${darkened(f)},0 6px 0 3px ${outline(mode)};display:flex;flex-direction:column;align-items:center;justify-content:center;filter:saturate(${sel?1:.35});color:${P.ink};text-align:center;padding:6px">
   ${emoji?`<div style="font-size:${size*.36}px;line-height:1">${emoji}</div>`:''}<div class="caption" style="font-size:${emoji?13:26}px;${emoji?'':'font-family:Baloo 2;font-weight:800'};line-height:1.1">${title}</div>
   ${sel?`<div style="position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;background:${P.grass};border:3px solid ${P.ink};display:flex;align-items:center;justify-content:center;font:900 15px Nunito">✓</div>`:''}</div>`;}
function obPhone(mode,inner){return `<div class="phone ${mode}" style="--outline:${outline(mode)};background:${mode==='day'?P.cream:P.nightSky}">${inner}</div>`;}
function header(t,sub,mode){return `<div style="text-align:center;padding:0 8px"><div class="h-title">${t}</div>${sub?`<div class="body" style="opacity:.7;margin-top:6px">${sub}</div>`:''}</div>`;}
function card(inner,mode){return `<div style="background:${mode==='day'?'#fff':P.dusk};border:3px solid ${outline(mode)};border-radius:28px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center">${inner}</div>`;}
function speakerRow(char,text,mode,size=72){return `<div class="prompt">${charSVG(char,mode==='night'?'sleepy':'happy',size,mode)}<span class="btn" style="background:${accent('sky',mode)};box-shadow:0 6px 0 ${darkened(accent('sky',mode))},0 6px 0 3px ${outline(mode)};font:700 16px Nunito;padding:10px 14px;min-height:64px;max-width:240px">🔊 <span>${text}</span></span></div>`;}
function obWelcome(lang,mode){const t=OB[lang];return obPhone(mode,obTop(1,mode,{back:false})+`
  <div style="display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px 16px">${charSVG('pamuk','happy',210,mode)}<div class="h-display">Masalcık</div>${speakerRow('pamuk',t.hello,mode)}
  <div class="caption" style="opacity:.65;text-align:center">✦ ${t.ai}</div></div>`+obBottom(t.start,mode));}
function obParent(lang,mode){const t=OB[lang];return obPhone(mode,obTop(2,mode)+`<div style="padding:16px;display:flex;flex-direction:column;gap:16px">${header(t.pTitle,t.pSub,mode)}
  ${card(`<div class="h-headline">${t.kids}</div><div style="display:flex;gap:16px">${[1,2,3,4].map(n=>choice('',n,n===2,'grape',mode,60)).join('')}</div>`,mode)}
  ${card(`<div class="h-headline">${t.bed}</div><div style="font:800 34px 'Baloo 2';letter-spacing:2px;padding:6px 18px;border-radius:14px;background:${mode==='day'?'#F4EEFF':'#2C2560'}">${lang==='tr'?'20:00':'8:00 PM'}</div><div class="caption" style="opacity:.7">${t.bedNote}</div>`,mode)}
  <div class="caption" style="opacity:.7;text-align:center">🛡 ${t.privacy}<br><u>${t.privacyLink}</u></div></div>`+obBottom(t.cont,mode));}
function field(text,mode,{ph=false,big=true}={}){return `<div style="flex:1;min-height:${big?56:52}px;border-radius:18px;border:3px solid ${outline(mode)};background:${mode==='day'?'#fff':P.dusk};display:flex;align-items:center;padding:0 16px;${big?"font:800 22px 'Baloo 2'":'font:600 16px Nunito'};${ph?'opacity:.45':''}">${text}</div>`;}
function obChild(lang,mode){const t=OB[lang];return obPhone(mode,obTop(3,mode)+`<div style="padding:16px;display:flex;flex-direction:column;gap:14px">${header(t.cTitle,t.cSub,mode)}
  <div class="bodyBold">${t.name}</div><div style="display:flex;gap:8px;align-items:center">${field(t.child,mode)}${bubble('','🔊','sky',mode,{circle:true})}</div>
  <div class="bodyBold">${t.pron}</div>${field(t.pronPh,mode,{ph:true,big:false})}<div class="caption" style="opacity:.7">${t.pronNote}</div>
  <div class="bodyBold" style="text-align:center">${t.age}</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;justify-items:center">${[3,4,5,6,7,8,9].map(a=>choice('',a,a===5,'orange',mode,62)).join('')}</div></div>`+obBottom(t.cont,mode));}
function obInterests(lang,mode){const t=OB[lang],cols=['sun','grass','berry','grape','orange','sky'],sel=[0,1,5];
  return obPhone(mode,obTop(4,mode)+`<div style="padding:16px;display:flex;flex-direction:column;gap:18px;align-items:center">${speakerRow('findik',t.iPrompt,mode)}
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px 14px">${t.interests.slice(0,9).map(([e,n],i)=>choice(e,n,sel.includes(i),cols[i%6],mode,100)).join('')}</div>
  <div class="stars">${[0,1,2,3,4].map(i=>star(i<3,mode)).join('')}</div></div>`+obBottom(t.cont,mode));}
function obValues(lang,mode){const t=OB[lang];return obPhone(mode,obTop(5,mode)+`<div style="padding:16px;display:flex;flex-direction:column;gap:20px">${header(t.vTitle,t.vSub,mode)}
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px 14px;justify-items:center">${t.values.map(([e,n],i)=>choice(e,n,i===0,'berry',mode,104)).join('')}</div></div>`+obBottom(t.cont,mode,{skip:t.skip}));}
function obAvatar(lang,mode){const t=OB[lang],O=outline(mode),tabs=['☺','✋','✂','🎨','👕','🐾'];
  const opt=(inner,sel)=>`<div style="width:84px;height:84px;border-radius:50%;background:${mode==='day'?'#fff':P.dusk};border:${sel?6:3}px solid ${sel?P.grass:O};display:flex;align-items:center;justify-content:center;overflow:hidden;${sel?'transform:scale(1.06)':''}">${inner}</div>`;
  return obPhone(mode,obTop(6,mode)+`<div style="padding:12px 16px;display:flex;flex-direction:column;gap:12px;align-items:center">${speakerRow('pamuk',t.aPrompt,mode,64)}
  <div style="position:relative;display:flex;align-items:flex-end"><div style="position:absolute;left:10px;right:10px;bottom:-6px;height:50px;border-radius:50%;background:${P.grass};opacity:${mode==='day'?.45:.25}"></div><div style="position:relative">${avatarSVG(160,mode,'happy',2)}</div><div style="position:relative;margin-left:-12px">${charSVG('lodos','happy',110,mode)}</div></div>
  <div style="display:flex;gap:8px">${tabs.map((x,i)=>`<span class="btn circle" style="width:48px;height:48px;font-size:20px;background:${accent(i===2?'grape':'sky',mode)};filter:saturate(${i===2?1:.4});box-shadow:0 5px 0 ${darkened(accent(i===2?'grape':'sky',mode))},0 5px 0 3px ${O}">${x}</span>`).join('')}</div>
  <div class="h-headline">${t.hairTab}</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">${[0,1,2,3,4,5].map(i=>opt(`<div style="margin-top:28px">${avatarSVG(118,mode,'happy',i)}</div>`,i===2)).join('')}</div></div>`+obBottom(t.ready,mode,{icon:'✦'}));}
function obFinale(lang,mode){const t=OB[lang],cols=[P.sun,P.berry,P.grass,P.grape,P.orange];
  let stars='';for(let i=0;i<14;i++){const a=i/14*2*Math.PI;stars+=`<div style="position:absolute;left:${185+Math.cos(a)*170-13}px;top:${360+Math.sin(a)*220-60-13}px;transform:rotate(${i*25}deg)"><svg width="26" height="26" viewBox="0 0 32 32"><path d="${starPath(16,16,15)}" fill="${cols[i%5]}" stroke="${outline(mode)}" stroke-width="2"/></svg></div>`;}
  return `<div class="phone ${mode}" style="--outline:${outline(mode)};background:${mode==='day'?'#ADE4FA':P.nightSky}">${stars}
  <div style="position:absolute;left:0;right:0;top:170px;text-align:center;padding:0 20px" class="h-display">${t.welcome(t.child)}</div>
  <div style="position:absolute;left:0;right:0;top:400px;display:flex;justify-content:center;align-items:flex-end">${charSVG('pamuk','happy',120,mode)}<div style="margin:0 -16px">${avatarSVG(180,mode,'happy',2)}</div>${charSVG('lodos','happy',120,mode)}</div>
  ${obBottom(t.go,mode,{icon:'⌖',color:'sun'})}</div>`;}


// ---------- Masal Oynatıcı (Player/StoryPlayerView.swift) ----------
function dimFor(p){return p<.5?0:p<.8?(p-.5)/.3*.5:.5+(p-.8)/.2*.4;}
function playerScreen(lang,{progress=.1,subtitle=null,word=0,timer=null,lullaby=false,finished=false}={}){
  const mode='night',dim=finished?.9:dimFor(progress);
  const T=lang==='tr'?{timer:timer??'Masal bitince',lul:lullaby?'Ninni açık':'Ninni kapalı'}:{timer:timer??'End of story',lul:lullaby?'Lullaby on':'Lullaby off'};
  let sub='';
  if(subtitle){const words=subtitle.split(' ');sub=`<div style="margin:0 16px 18px;padding:16px;border-radius:28px;background:rgba(30,27,75,.7);text-align:center;font:800 21px/1.25 'Baloo 2'">${words.map((w,i)=>`<span style="color:${i<=word?P.moon:'rgba(232,230,255,.45)'}">${w}</span>`).join(' ')}</div>`;}
  const center=finished?`<div style="width:96px;height:96px;display:flex;align-items:center;justify-content:center;font-size:44px;color:${P.moon}">☾✦</div>`
    :bubble('',progress>0&&!finished?'❚❚':'▶','sky',mode,{circle:true}).replace('class="btn circle" style="','class="btn circle" style="width:96px;height:96px;font-size:34px;');
  return `<div class="phone night" style="--outline:#14112F;color:${P.nightInk}"><canvas class="sky"></canvas>
   <div style="position:absolute;left:-40%;right:-40%;top:62%;height:45%;border-radius:50%;background:${darkened(accent('grass','night'),.35)}"></div>
   <div style="position:absolute;left:0;right:0;top:${subtitle?250:300}px;display:flex;justify-content:center;align-items:flex-end">${charSVG('pamuk','sleepy',160,mode)}<div style="margin-left:-10px">${charSVG('findik','sleepy',120,mode)}</div></div>
   <div style="position:absolute;left:16px;top:54px">${bubble('','✕','grape',mode,{circle:true})}</div>
   <div style="position:absolute;left:0;right:0;bottom:34px">${sub}
    <div style="display:flex;justify-content:center;align-items:center;gap:24px">
     <div style="text-align:center">${bubble('','☾z','grape',mode,{circle:true})}<div class="caption" style="opacity:.8;margin-top:6px">${T.timer}</div></div>
     ${center}
     <div style="text-align:center">${bubble('',lullaby?'♫':'♪̸',lullaby?'sky':'grape',mode,{circle:true})}<div class="caption" style="opacity:.8;margin-top:6px">${T.lul}</div></div>
    </div></div>
   <div style="position:absolute;inset:0;background:rgba(0,0,0,${dim})"></div></div>`;}

const TN={tr:{greet:'Hoş geldin Ayşe! Bu gece nasıl bir masal dinlemek istersin?',who:'Kim olsun?',where:'Nerede geçsin?',what:'Ne olsun?',pamuk:'Pamuk seçsin',

 en:{greet:"Welcome, Emma! What kind of story would you like tonight?",who:'Who should it be?',where:'Where should it be?',what:'What should happen?',pamuk:'Let Pamuk choose',

function tnShell(inner,{dots=0,back=false}={}){const m='night';
  return `<div class="phone night" style="--outline:#14112F;color:${P.nightInk}"><canvas class="sky"></canvas>
   <div style="position:absolute;left:16px;right:16px;top:54px;display:flex;justify-content:space-between;align-items:center">${bubble('','✕','grape',m,{circle:true})}
   ${dots?`<div style="display:flex;gap:8px">${[1,2,3].map(i=>`<span style="width:${i===dots?28:14}px;height:14px;border-radius:99px;border:2px solid #14112F;background:${i<=dots?accent('grape',m):P.dusk}"></span>`).join('')}</div>`:''}
   ${back?bubble('','‹','grape',m,{circle:true}):'<span style="width:64px"></span>'}</div>
   <div style="position:absolute;left:16px;right:16px;top:140px;bottom:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px">${inner}</div></div>`;}
function bigChoice(icon,label,color){const f=accent(color,'night');
  return `<div style="width:140px;height:140px;border-radius:50%;background:${f};border:3px solid #14112F;box-shadow:0 6px 0 ${darkened(f)},0 6px 0 3px #14112F;display:flex;flex-direction:column;align-items:center;justify-content:center;color:${P.ink};text-align:center;padding:8px">${icon}<div class="caption" style="line-height:1.1">${label}</div></div>`;}
function choiceGrid(items){return `<div style="display:flex;flex-direction:column;align-items:center;gap:22px"><div style="display:flex;gap:24px">${items.slice(0,2).join('')}</div><div style="display:flex;gap:24px">${items.slice(2).join('')}</div></div>`;}
function pamukBtn(label){const f=accent('sun','night');return `<span class="btn" style="background:${f};box-shadow:0 6px 0 ${darkened(f)},0 6px 0 3px #14112F;padding:6px 18px 6px 8px;font:800 20px 'Baloo 2'">${charSVG('pamuk','happy',44,'night')}${label}</span>`;}
function tnPrompt(text){return speakerRow('pamuk',text,'night',60);}
function tnGreeting(l){const t=TN[l];return tnShell(`${charSVG('pamuk','sleepy',200,'night')}<div style="display:flex;align-items:center;gap:8px">${bubble('','🔊','sky','night',{circle:true})}</div>${bubble('','★','sky','night',{circle:true}).replace('width:64px;height:64px','width:96px;height:96px;font-size:36px')}`);}
function tnChars(l){const t=TN[l];return tnShell(`${tnPrompt(t.who)}${choiceGrid(t.chars.map(([id,n])=>bigChoice(charSVG(id,'happy',92,'night'),n,'grape')))}${pamukBtn(t.pamuk)}`,{dots:1});}
function tnRegions(l){const t=TN[l];return tnShell(`${tnPrompt(t.where)}${choiceGrid(t.regions.map(([id,n,ic,c])=>bigChoice(`<div style="font-size:44px">${ic}</div>`,n,c)))}${pamukBtn(t.pamuk)}`,{dots:2,back:true});}
function tnMoods(l){const t=TN[l];return tnShell(`${tnPrompt(t.what)}${choiceGrid(t.moods.map(([ic,n,c])=>bigChoice(`<div style="font:800 40px 'Baloo 2'">${ic}</div>`,n,c)))}${pamukBtn(t.pamuk)}`,{dots:3,back:true});}
function tnWaiting(l){const t=TN[l];const cols=[P.moon,P.firefly];let stars='';
  for(let i=0;i<12;i++){const x=160+(i%2?1:-1)*(10+i*11),y=300-i*20;stars+=`<div style="position:absolute;left:${x}px;top:${y}px;opacity:${1-i/13}"><svg width="${18+i%3*6}" height="${18+i%3*6}" viewBox="0 0 32 32"><path d="${starPath(16,16,15)}" fill="${cols[i%2]}"/></svg></div>`;}
  const book=`<div style="position:relative;width:236px;height:156px;border-radius:18px;background:${accent('berry','night')};border:3px solid #14112F;display:flex;gap:0;padding:8px"><div style="flex:1;border-radius:14px;background:#FFF1DA;border:3px solid #14112F"></div><div style="flex:1;border-radius:14px;background:#FFF8EC;border:3px solid #14112F"></div></div>`;
  return tnShell(`<div style="position:relative;width:340px;height:330px">${stars}<div style="position:absolute;left:52px;top:170px">${book}</div><div style="position:absolute;left:95px;top:30px">${charSVG('pamuk','happy',150,'night')}</div></div>
   <div class="h-title" style="color:${P.moon};text-align:center">${t.title}</div>${bubble('','🔊','sky','night',{circle:true})}`);}
function tnOffer(l){const t=TN[l];return tnShell(`${charSVG('nur','sleepy',150,'night')}${speakerRow('nur',t.offer,'night',56)}
  <div style="display:flex;gap:14px">${t.lib.map(([n,r,m,c])=>storyCard(n,r,m,c,'night',{lang:l})).join('')}</div>`);}


// ---------- Kitaplık + Hazine Sandığı (Library/*, Treasure/*) ----------
const OUTFIT_ANCHOR={pamuk:{head:[104,46],neck:[100,152]},findik:{head:[98,44],neck:[98,162]},lodos:{head:[100,24],neck:[100,174]},nur:{head:[100,36],neck:[100,152]},yildiz:{head:[100,18],neck:[100,160]},kaptan_midye:{head:[100,20],neck:[100,164]}};
function outfitSVG(char,style,color,mode){const O=outline(mode),st=`stroke="${O}" stroke-width="3" stroke-linejoin="round"`,a=OUTFIT_ANCHOR[char],f=accent(color,mode);
  if(style==='nightcap'){const [x,y]=a.head;return `<g transform="translate(${x} ${y}) rotate(12)"><path d="M-39 31 C-31 -31 0 -37 39 -25 Q43 -16 35 -12 C11 -6 33 17 35 31Z" fill="${f}" ${st}/><rect x="-37" y="18" width="74" height="16" rx="8" fill="#fff" ${st}/><circle cx="40" cy="-22" r="15" fill="${P.firefly}" fill-opacity=".45"/><circle cx="40" cy="-22" r="9" fill="${P.sun}" ${st}/></g>`;}
  if(style==='scarf'){const [x,y]=a.neck;return `<g transform="translate(${x} ${y})"><rect x="-56" y="-12" width="112" height="24" rx="12" fill="${f}" ${st}/><rect x="17" y="2" width="22" height="40" rx="8" fill="${f}" ${st} transform="rotate(-12 28 22)"/>${[-30,0,30].map(dx=>`<path d="${starPath(dx,0,6)}" fill="#fff"/>`).join('')}</g>`;}
  if(style==='crown'){const [x,y]=a.head;return `<g transform="translate(${x-31} ${y-18})"><path d="M0 36 L0 9 Q7 20 19 20 Q26 4 31 0 Q36 4 43 20 Q55 20 62 9 L62 36Z" fill="${P.moon}" ${st}/><circle cx="31" cy="22" r="6" fill="${f}" ${st}/></g>`;}
  const [x,y]=a.neck;return `<g transform="translate(${x} ${y})"><ellipse cx="-14" cy="0" rx="15" ry="11" fill="${f}" ${st}/><ellipse cx="14" cy="0" rx="15" ry="11" fill="${f}" ${st}/><circle r="7" fill="${darkened(f,.15)}" ${st}/></g>`;}
function charWithOutfit(id,mood,size,mode,o){return charSVG(id,mood,size,mode).replace('</svg>',o?outfitSVG(id,o[0],o[1],mode)+'</svg>':'</svg>');}
const LIBT={tr:{shelves:[['♥','Favorilerim',[['Ayşe ve Kayıp Fener','whisper_forest',10,'findik',true]]],['✦','Benim masallarım',[['Ayşe ve Uykucu Yıldız','star_hill',10,'yildiz'],['Ayşe ile Şarkı Söyleyen Deniz','lighthouse_cove',15,'kaptan_midye']]],['▥','Kitaplık masalları',[['Keloğlan ile Sihirli Kaşık','storyteller_plane',10,'nur'],["Fındık'ın Kış Hazırlığı",'whisper_forest',10,'findik']]]]},
 en:{shelves:[['♥','My favourites',[['Emma and the Lost Lantern','whisper_forest',10,'findik',true]]],['✦','My stories',[['Emma and the Sleepy Star','star_hill',10,'yildiz'],['Emma and the Singing Sea','lighthouse_cove',15,'kaptan_midye']]]]}};
function libraryScreen(lang,mode){const t=LIBT[lang],O=outline(mode);
  const card=(n,r,m,c,fav)=>`<div style="position:relative;flex:none">${storyCard(n,r,m,c,mode,{fav,lang})}<div style="position:absolute;right:-6px;bottom:64px">${bubble('',fav?'♥':'♡','berry',mode,{circle:true}).replace('width:64px;height:64px','').replace('class="btn circle" style="','class="btn circle" style="width:44px;height:44px;font-size:20px;')}</div></div>`;
  return `<div class="phone ${mode}" style="--outline:${O};background:${mode==='day'?P.cream:P.nightSky};color:${mode==='day'?P.ink:P.nightInk}">${mode==='night'?'<canvas class="sky"></canvas>':''}
   <div style="position:absolute;left:16px;right:16px;top:54px;display:flex;justify-content:space-between;align-items:center">${bubble('','✕','grape',mode,{circle:true})}<span style="font-size:30px">▥</span><span style="width:64px"></span></div>
   <div style="position:absolute;left:0;right:0;top:140px;bottom:0;overflow:hidden">${t.shelves.map(([ic,title,items])=>`<div style="margin-bottom:6px"><div class="h-headline" style="padding:0 16px 8px;color:${ic==='♥'?P.berry:'inherit'}">${ic} ${title}</div>
   <div style="display:flex;gap:16px;padding:0 16px 14px;overflow:hidden">${items.map(([n,r,m,c,f])=>card(n,r,m,c,!!f)).join('')}</div>
   <div style="height:12px;margin:-8px 8px 10px;border-radius:6px;background:#C98F4E${mode==='night'?'99':''};border:2px solid ${O}"></div></div>`).join('')}</div></div>`;}
const TRT={tr:{intro:'Burası senin Hazine Sandığın! Dinlediğin her masal için bir çıkartma kazanırsın.',week:'Bu hafta',weekLine:'Bu hafta 5 gece masal dinledin.',toGo:'Arka arkaya 2 gece daha masal dinlersen yeni bir kıyafet kazanırsın!',stickers:'Çıkartmalarım',outfits:'Kıyafetler',friends:'Masal arkadaşların',
   o1:"Pamuk'un gece lambası şapkası",not:'Henüz',f:[['Fener Tavşan','Küçük, beyaz, utangaç bir tavşan; elinde sarı bir fener taşır.','3 masalda'],['Işık Yaprak','Geceleri parlayan küçük bir yaprak.','1 masalda']]},
 en:{intro:'This is your Treasure Chest! You win a sticker for every story you listen to.',week:'This week',weekLine:'You listened to stories on 5 nights this week.',toGo:"Listen to stories 2 more nights in a row and you'll win a new outfit!",stickers:'My stickers',outfits:'Outfits',friends:'Your story friends',
   o1:"Pamuk's night-light hat",not:'Not yet',f:[['Lantern Bunny','A small, shy white bunny who carries a little yellow lantern.','in 3 stories']]}};
function treasureScreen(lang,mode){const t=TRT[lang],O=outline(mode),ink=mode==='day'?P.ink:P.nightInk;
  const earned=[['🍃','grass',true],['⭐️','sun',false],['🐚','sky',false],['🏮','orange',true],['🌙','grape',false]];
  const ghosts=[['🌷','berry'],['📖','orange'],['🌈','grape']];
  const stk=earned.map(([e,c,n],i)=>`<div style="position:relative">${sticker(e,c,true,mode,[-3,4,-5,2,3][i])}${n?`<span style="position:absolute;top:-6px;right:-6px;background:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:${P.berry};font-weight:900">✦</span>`:''}</div>`).join('')+ghosts.map(([e,c],i)=>sticker(e,c,false,mode,[2,-4,5][i])).join('');
  const out=(id,o,has,worn,label)=>`<div style="width:104px;padding:6px;border-radius:24px;text-align:center;border:${worn?4:2}px solid ${worn?P.grass:O};background:${worn?'rgba(126,217,87,.35)':(mode==='day'?'rgba(255,255,255,.6)':'rgba(59,47,107,.6)')}"><div style="${has?'':'filter:grayscale(1);opacity:.4'}">${charWithOutfit(id,has?'happy':'sleepy',88,mode,has?o:null)}</div><div class="caption" style="line-height:1.1">${label}</div></div>`;
  return `<div class="phone ${mode}" style="--outline:${O};background:${mode==='day'?P.cream:P.nightSky};color:${ink}">${mode==='night'?'<canvas class="sky"></canvas>':''}
   <div style="position:absolute;left:16px;right:16px;top:54px;bottom:0;overflow:hidden;display:flex;flex-direction:column;gap:14px">
    <div>${bubble('','✕','grape',mode,{circle:true})}</div>
    ${speakerRow('pamuk',t.intro,mode,58)}
    <div><div class="h-headline">★ ${t.week}</div><div class="stars" style="margin:6px 0">${[0,1,2,3,4,5,6].map(i=>star(i<5,mode)).join('')}</div><div class="bodyBold">${t.weekLine}</div><div class="body" style="opacity:.7">${t.toGo}</div></div>
    <div><div class="h-headline">✸ ${t.stickers}</div><div style="display:grid;grid-template-columns:repeat(4,64px);gap:14px 18px;margin-top:8px">${stk}</div></div>
    <div><div class="h-headline">👕 ${t.outfits}</div><div style="display:flex;gap:12px;margin-top:8px">${out('pamuk',['nightcap','berry'],true,true,t.o1)}${out('findik',null,false,false,t.not)}${out('lodos',null,false,false,t.not)}</div></div>
    <div><div class="h-headline">👥 ${t.friends}</div>${t.f.map(([n,c,a])=>`<div style="display:flex;gap:12px;align-items:center;margin-top:8px"><div style="flex:none;width:56px;height:56px;border-radius:50%;background:${accent('sun',mode)};border:3px solid ${O};display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 32 32"><path d="${starPath(16,16,14)}" fill="#fff"/></svg></div><div><div class="bodyBold">${n}</div><div class="caption" style="opacity:.7">${c}</div><div class="caption" style="opacity:.7">${a}</div></div></div>`).join('')}</div>
   </div></div>`;}
function greetingTwo(lang){const l=lang==='tr'?['Yeni masal','Kitaplığım']:['New story','My library'];
  const big=(ic,c)=>bubble('',ic,c,'night',{circle:true}).replace('width:64px;height:64px','').replace('class="btn circle" style="','class="btn circle" style="width:96px;height:96px;font-size:36px;');
  return tnShell(`${charWithOutfit('pamuk','sleepy',200,'night',['nightcap','berry'])}${bubble('','🔊','sky','night',{circle:true})}<div style="display:flex;gap:32px;text-align:center"><div>${big('★','sky')}<div class="caption" style="margin-top:6px">${l[0]}</div></div><div>${big('▥','grape')}<div class="caption" style="margin-top:6px">${l[1]}</div></div></div>`);}


// ---------- Ebeveyn Köşesi (ParentZone/*) — iOS gruplu liste ----------
function ios(title,sections,{tab=0,lang='tr'}={}){const tabs=lang==='tr'?['Çocuklar','Ayarlar','Hesap']:['Children','Settings','Account'];const icons=['👨‍👧','⚙︎','◉'];
  const sec=([h,rows,f])=>`${h?`<div style="font:600 13px -apple-system,system-ui;color:#6d6d72;text-transform:uppercase;margin:22px 32px 6px">${h}</div>`:'<div style="height:22px"></div>'}<div style="margin:0 16px;background:#fff;border-radius:12px;overflow:hidden">${rows.map((r,i)=>`<div style="display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 16px;${i?'border-top:0.5px solid #d1d1d6;':''}font:17px -apple-system,system-ui;color:#000">${r}</div>`).join('')}</div>${f?`<div style="font:13px -apple-system,system-ui;color:#6d6d72;margin:6px 32px 0;line-height:1.35">${f}</div>`:''}`;
  return `<div class="phone" lang="${lang}" style="background:#f2f2f7"><div style="position:absolute;inset:0;padding-top:50px;overflow:hidden">
   <div style="display:flex;justify-content:flex-end;padding:6px 16px;font:17px -apple-system,system-ui;color:${P.grape}">${lang==='tr'?'Kapat':'Close'}</div>
   <div style="font:700 34px -apple-system,system-ui;padding:0 16px 4px">${title}</div>${sections.map(sec).join('')}</div>
   <div style="position:absolute;left:0;right:0;bottom:0;height:78px;background:rgba(249,249,249,.94);border-top:0.5px solid #c6c6c8;display:flex;justify-content:space-around;padding-top:8px">${tabs.map((t,i)=>`<div style="text-align:center;font:600 10px -apple-system,system-ui;color:${i===tab?P.grape:'#8e8e93'}"><div style="font-size:22px">${icons[i]}</div>${t}</div>`).join('')}</div></div>`;}
const tog=(on)=>`<span style="margin-left:auto;width:51px;height:31px;border-radius:16px;background:${on?P.grass:'#e9e9eb'};position:relative;flex:none"><span style="position:absolute;top:2px;${on?'right:2px':'left:2px'};width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)"></span></span>`;
const val=(v)=>`<span style="margin-left:auto;color:#8e8e93">${v}</span>`;
const chev=`<span style="color:#c7c7cc;font-size:20px;margin-left:6px">›</span>`;
function parentChildren(){return ios('Çocuklar',[
  ['Bu hafta — Ayşe',[`<div style="display:flex;width:100%;text-align:center">${[['5','masal'],['4/7','gece'],['20:52','tahmini uyku']].map(([v,l],i)=>`<div style="flex:1;${i?'border-left:0.5px solid #d1d1d6':''}"><div style="font:700 22px -apple-system,system-ui">${v}</div><div style="font:12px -apple-system,system-ui;color:#8e8e93">${l}</div></div>`).join('')}</div>`]],
  ['Profiller',[`${avatarSVG(48,'day','happy',2)}<div><div style="font-weight:600">Ayşe</div><div style="font-size:15px;color:#8e8e93">5 yaş · 12 masal</div></div><span style="margin-left:auto;color:${P.grass};font-size:22px">✔︎</span>${chev}`,
    `${avatarSVG(48,'day','happy',4)}<div><div style="font-weight:600">Mert</div><div style="font-size:15px;color:#8e8e93">7 yaş · 3 masal</div></div><span style="margin-left:auto"></span>${chev}`,
    `<span style="color:${P.grape}">⊕ Profil ekle</span>`],'En fazla 4 profil. Uygulamanın kimin için çalışacağını seçmek için profile girin.']],{tab:0});}
function parentSettingsEn(){return ios('Settings',[
  [null,[`Bedtime${val('<span style="background:#eeeef0;border-radius:6px;padding:4px 10px;color:#000">8:00 PM</span>')}`],'One hour before bedtime, the app switches to its calm night mode.'],
  ['Voice',[`Narrator${val('Mum')}${chev}`,`<span style="color:${P.grape}">▶︎ Hear a sample</span>`,`<span style="color:${P.grape}">🎙 Narrate in my own voice</span>`]],
  ['Story',[`Story length${val('10 min')}${chev}`,`Subtitles (word by word)${tog(false)}`,`After the story${val('15 min')}${chev}`]],
  ['Content filters',[`Mild excitement${tog(false)}`,`Small disagreements${tog(false)}`,`Loss and separation themes${tog(false)}`],'All are off by default. Violence, frightening imagery, brands and real people are always excluded; every story passes a safety check before it plays.']],{tab:1,lang:'en'});}
function parentAccount(){return ios('Hesap',[
  ['Abonelik',[`Plan${val('Ücretsiz')}`,`<span style="color:${P.grape}">★ Premium'u incele</span>`,`<span style="color:${P.grape}">Satın alımları geri yükle</span>`],'Ücretsiz sürümde her gün 1 kişisel masal ve kitaplıktan haftada 3 masal. Kredi ya da jeton yok.'],
  ['Gizlilik',[`✨ <span style="font-size:15px">Masallar yapay zekâyla üretilir ve güvenlik filtrelerinden geçer.</span>`,`🛡 <span style="font-size:15px">Çocuğunuz için yalnızca adını, yaşını ve ilgi alanlarını saklarız. Reklam yok, üçüncü taraf takip yok.</span>`,`<span style="color:${P.grape}">Aydınlatma metnini okuyun</span>`]],
  [null,[`<span style="color:#ff3b30">🗑 Tüm verilerimi sil</span>`],"Hesabınız, çocuk profilleri, masallar, ses dosyaları ve ses örneğiniz sunucudan ve bu cihazdan kalıcı olarak silinir."]],{tab:2});}
function storyText(){return `<div class="phone" style="background:#fff"><div style="position:absolute;inset:0;padding:54px 20px 0;overflow:hidden;font-family:-apple-system,system-ui">
  <div style="display:flex;justify-content:space-between;color:${P.grape};font-size:17px"><span>‹ Masal geçmişi</span><span>⬆︎ Paylaş</span></div>
  <div style="font:700 24px -apple-system,system-ui;margin-top:16px">Ayşe ve Kayıp Fener</div><div style="color:#8e8e93;margin:4px 0 14px">Fısıltı Ormanı · 10 dk</div>
  ${["Bir varmış bir yokmuş, Fısıltı Ormanı'nda Ayşe adında meraklı bir çocuk yaşarmış. En yakın arkadaşı Fındık her akşam onun penceresine gelirmiş.","Bir akşam Fındık heyecanla gelmiş: \"Ayşe, ağaçların arasında küçük bir fener kaybolmuş! Onu bulursak bütün orman ışıl ışıl olacak.\"","Ayşe ile Fındık el ele vermişler. Yaprakların altına, çiçeklerin arkasına bakmışlar. Sonunda feneri bir sincap yuvasının yanında bulmuşlar.","Fenerin sahibi küçük bir tavşanmış. Feneri ona uzatmışlar, tavşan da kocaman gülümsemiş. Paylaşınca ışık iki katına çıkmış."].map(t=>`<p style="font-size:17px;line-height:1.45;margin:0 0 14px">${t}</p>`).join('')}
  </div><div style="position:absolute;left:12px;right:12px;bottom:14px;background:#f2f2f7;border-radius:14px;padding:12px;font:13px -apple-system,system-ui;box-shadow:0 -4px 20px rgba(0,0,0,.15)"><div style="color:#8e8e93;margin-bottom:8px">Ayşe ve Kayıp Fener — Masalcık ile çocuğuma özel bir uyku masalı. Sen de dinle: masalcik.app/s/…</div><div style="display:flex;gap:18px;justify-content:center">${[['#25D366','WhatsApp'],['#34C759','Mesajlar'],['#007AFF','Mail']].map(([c,n])=>`<div style="text-align:center"><div style="width:52px;height:52px;border-radius:12px;background:${c}"></div><div style="margin-top:4px">${n}</div></div>`).join('')}</div></div></div>`;}

const mode=new URLSearchParams(location.search).get('screen')||'all';
const root=document.getElementById('root');
const screens={
  day:()=>gallery('day')+gallery2('day'),
  night:()=>gallery('night')+gallery2('night'),
  extras:()=>gate()+player(0)+player(0.9),
  onboarding:()=>obWelcome('tr','day')+obParent('en','day')+obChild('tr','day')+obInterests('tr','day')+obValues('en','day')+obAvatar('en','day')+obFinale('tr','day')+obInterests('en','night'),
  parent:()=>parentChildren()+parentSettingsEn()+parentAccount()+storyText(),
  treasure:()=>greetingTwo('tr')+libraryScreen('tr','night')+treasureScreen('tr','day')+treasureScreen('en','night'),
  tonight:()=>tnGreeting('tr')+tnChars('tr')+tnRegions('en')+tnMoods('tr')+tnWaiting('en')+tnOffer('tr'),
  player:()=>playerScreen('tr',{progress:.12,subtitle:"Bir varmış bir yokmuş, Fısıltı Ormanı'nda Ayşe adında meraklı bir çocuk yaşarmış.",word:5})
    +playerScreen('en',{progress:.35,timer:'30 min',lullaby:true})
    +playerScreen('tr',{progress:.78})
    +playerScreen('en',{finished:true}),
  map:()=>mapScreen('day','tr')+mapScreen('day','tr',{focus:'storyteller_plane'})+mapScreen('night','en')+mapScreen('night','en',{focus:'whisper_forest'}),
};
const caps={day:['Galeri — Gündüz (1/2)','Galeri — Gündüz (2/2)'],night:['Galeri — Gece (1/2)','Galeri — Gece (2/2)'],extras:['ParentGate','Oynatıcı arka planı — başlangıç','Oynatıcı — %90 ilerleme (kararma)'],parent:['Çocuklar: haftalık özet + profiller (TR)','Settings (EN)','Hesap: abonelik, gizlilik, veri silme (TR)','Masal metni + WhatsApp paylaşımı (TR)'],treasure:['Uyku Evi: yeni masal / kitaplığım (TR, Pamuk şapkalı)','Kitaplık rafları (TR)','Hazine Sandığı (TR)','Treasure Chest — night (EN)'],tonight:['Uyku Evi: Pamuk karşılar (TR)','1 Kim olsun? (TR)','2 Where? (EN)','3 Ne olsun? (TR)','Writing: book + stars (EN)','Hak dolunca: kitaplık önerisi (TR)'],player:['Başlangıç, karaoke altyazı açık (TR)','Timer 30 min, lullaby on (EN)','%78 ilerleme: kararıyor (TR)','Finished: good night (EN)'],onboarding:['1 Karşılama (TR)','2 Parent info (EN)','3 Çocuğun adı ve yaşı (TR)','4 İlgi alanları (TR)','5 Values (EN)','6 Avatar + buddy (EN)','Kutlama (TR)','4 Interests — night (EN)'],map:['Masal Adası — Gündüz (TR)','Masalcı Çınarı seçildi (TR)','Story Island — Night (EN)','Whisper Forest selected (EN)']};
const keys=mode==='all'?['day','night','extras','map','onboarding','player','tonight','treasure','parent']:[mode];
if(mode==='onboarding'||mode==='tonight') root.style.cssText='flex-wrap:wrap;max-width:1720px;margin:0 auto';
root.innerHTML=keys.map(k=>{const tmp=document.createElement('div');tmp.innerHTML=screens[k]();
  return [...tmp.children].map((el,i)=>`<div>${el.outerHTML}<div class="caption-under">${caps[k][i]}</div></div>`).join('');}).join('');
document.fonts.ready.then(()=>{document.querySelectorAll('canvas.sky').forEach(cv=>drawSky(cv,{dimming:+(cv.dataset.dim||0)}));document.body.dataset.ready='1';});
</script>
